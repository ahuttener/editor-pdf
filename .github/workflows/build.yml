name: Gerar instaladores

# Roda a cada push na main e quando uma tag v* é criada (ex.: v1.0.0 publica uma Release com os instaladores)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
          - os: macos-latest
            target: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            target: --linux AppImage deb rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ferramentas do RPM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar idiomas do OCR
        run: node scripts/prepare-vendor.mjs

      - name: Gerar instaladores
        env:
          # Sem certificado ainda: o Mac e o Windows geram versões não assinadas
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Guardar os instaladores
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
