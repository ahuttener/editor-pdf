name: Gerar instaladores

# Roda a cada push na main e quando uma tag v* é criada (ex.: v1.0.0 publica uma Release com os instaladores)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
          - os: macos-latest
            target: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            target: --linux AppImage deb rpm
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ferramentas do RPM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar idiomas do OCR
        run: node scripts/prepare-vendor.mjs

      # Mac: assina e notariza quando os segredos existem (Settings > Secrets > Actions):
      #   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD (certificado Developer ID Application)
      #   APPLE_API_KEY_P8 (conteúdo do .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER (chave de API do App Store Connect)
      - name: Preparar assinatura do Mac
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          echo "CSC_LINK=$MAC_CERT_P12_BASE64" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          echo "MAC_SIGN=1" >> "$GITHUB_ENV"

      - name: Gerar instaladores
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          if [ "$MAC_SIGN" = "1" ]; then
            npx electron-builder ${{ matrix.target }} --publish never -c.mac.notarize=true
          else
            # sem certificado: gera versões não assinadas
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder ${{ matrix.target }} --publish never
          fi

      - name: Guardar os instaladores
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
